name: Build APK

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Create temporary release keystore
        run: |
          keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"
          cp app/keystore app-wearos/keystore
      - name: Build debug and release APKs
        run: ./gradlew assemblePlayDebug assemblePlayRelease
      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autodebug-latest
          name: Latest auto build APKs
          body: Automated debug and release builds from commit ${{ github.sha }} on ${{ github.ref_name }}.
          prerelease: true
          files: |
            app/build/outputs/apk/play/debug/app-play-debug.apk
            app/build/outputs/apk/play/release/app-play-release.apk
